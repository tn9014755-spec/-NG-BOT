name: Fix BC FRESH loss
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fresh-loss-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clamp negative MMKK plus HUY
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bc_fresh_bot.js')
          s=p.read_text(encoding='utf-8')
          old='loss:(h+mm)*f'
          new='loss:Math.max(0,h+mm)*f'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bc_fresh_bot.js
          git diff --cached --quiet && exit 0
          git commit -m 'Clamp negative MMKK plus HUY [fresh-loss-fixed]'
          git push
