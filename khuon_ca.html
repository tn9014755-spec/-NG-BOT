<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LỊCH CA LÀM VIỆC — MỸ QUỚI</title><style>body{margin:0;background:#eef2f8;color:#14213d;font-family:Arial,sans-serif;font-weight:600}.wrap{max-width:780px;margin:auto;padding:12px}.hero{background:#0b2452;color:#fff;border-radius:20px;padding:18px}.title{font-size:28px;font-weight:900;margin:7px 0}.date{font-size:12px;opacity:.8}.card{background:#fff;border:1px solid #e4ebf3;border-radius:17px;padding:14px;margin-top:10px}.head{font-size:14px;font-weight:900;margin-bottom:10px}.buoi{border-radius:14px;padding:12px;margin:8px 0}.sang{background:#eff5ff;color:#1d4ed8}.trua{background:#fff7ed;color:#ea7317}.chieu{background:#f0fdf4;color:#0f9d58}.row{padding:7px 0;border-top:1px solid #ffffffaa;color:#334155;font-size:12px}.name{font-weight:800}.muted{color:#7b8798;font-size:11px}</style></head><body><div class="wrap"><div id="app"></div></div><script>const DATA="__CA_DATA__";const CA={1:'6h-8h',2:'8h-12h',3:'12h-14h',4:'14h-16h',5:'16h-18h',6:'18h-21h'};const BUOI={SÁNG:{c:[1,2],x:'sang'},TRƯA:{c:[3,4],x:'trua'},CHIỀU:{c:[5,6],x:'chieu'}};function render(k){const d=DATA.lich?.[k],app=document.getElementById('app');if(!d){app.innerHTML='<div class="card"><b>CA LÀM VIỆC</b><p>Chưa có lịch cho ngày này.</p></div>';return}let html=`<div class="hero"><div class="muted">LỊCH CA LÀM VIỆC · ${DATA.ma}</div><div class="title">${DATA.sieuThi}</div><div class="date">${k}</div></div><div class="card"><div class="head">AI ĐI CA NÀO</div>`;for(const [n,b] of Object.entries(BUOI)){html+=`<div class="buoi ${b.x}"><b>${n}</b>`;for(const ca of b.c){const ns=Object.entries(d).filter(([,v])=>v[ca]).map(([name,v])=>`${name} (${v[ca]})`).join(', ')||'—';html+=`<div class="row"><b>${CA[ca]}</b> · <span class="name">${ns}</span></div>`}html+='</div>'}html+='</div>';app.innerHTML=html}const today=new Date();const k=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;render(k);</script></body></html>
